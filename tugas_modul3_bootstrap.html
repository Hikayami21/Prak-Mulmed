<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi - Modul 3</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container" style="margin-top:30px;">
    <form action="">
      <div class="col-sm-10">
        <div class="form-group">
          <label for="name"> Nama :</label>
          <input type="text" class="form-control" placeholder="Name" name="nama" required>
        </div>
        <div class="form-group">
          <label for="email">Email :</label>
          <input type="email" class="form-control" placeholder="Email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password :</label>
          <input type="password" class="form-control" placeholder="Password" name="Password" required>
        </div>
        <div class="form-group">
          <label for="jk">Jenis Kelamin:</label>
          <select class="form-control" id="jk">
            <option>Pria</option>
            <option>Wanita</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>

  <footer class="text-center" style="margin-top:40px; padding:15px 0; background-color:#f2f2f2;">
    <p>Nama : [Isi Nama Anda] &nbsp;|&nbsp; NIM : [Isi NIM Anda]</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
</body>
</html>
